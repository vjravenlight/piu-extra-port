// Pump It Up Extra para Android (21/10). El juego (app\port + el disco entero) va adentro como assets, tal cual la
// carpeta juego\ de la build de Edge, y lo sirve la app (Servidor.java) en 127.0.0.1 con COOP/COEP. Se muestra con
// GeckoView (el motor de Firefox) porque la WebView de Android no da memoria compartida (crossOriginIsolated = false,
// medido en el Nubia) y el port la necesita. Una APK por procesador, asi pesa la mitad: arm64 y, con -Pabi=armeabi-v7a
// (armar_apk_gecko.ps1 -Bits32), la de los telefonos con Android de 32 bits, como varios Galaxy A13.
plugins {
    id 'com.android.application' version '9.3.3'
}
def abi = project.findProperty('abi') ?: 'arm64-v8a'

android {
    namespace = 'net.ravenlight.piu'
    // GeckoView 157 pide compilar contra Android 37.1 (la sub-version del SDK)
    compileSdk {
        version = release(37) { minorApiLevel = 1 }
    }
    defaultConfig {
        // (03/11, Charles: "ponele full para diferenciar") armar_apk_gecko.ps1 -Full: otra app, con su icono, al lado de la de siempre
        applicationId = project.findProperty('idApp') ?: 'net.ravenlight.piu'
        manifestPlaceholders = [nombreApp: project.findProperty('nombreApp') ?: 'Pump It Up Extra']
        minSdk = 29
        targetSdk = 35
        versionCode = 9
        versionName = '1.5.2'      // (05/11) tope de 50 temas por lista con canciones propias; 1.5.1: MODO EDIT, todos los modos, title y banner en las canciones propias; 1.5.0: moderacion, cuenta opcional; 1.4.1: listas fijas (app\port\listas.js); 1.4.0: la WebView con el puente (Juego.java)
        ndk { abiFilters += [abi] }
    }
    sourceSets {
        // -Pjuego=<carpeta>: otra carpeta juego\ (la de la build sin disco, armar_apk_gecko.ps1 -SinDisco)
        main { assets.srcDirs = [file(project.findProperty('juego') ?: '../../../build/Pump It Up Extra - Edge/juego')] }
    }
    // el disco ya viene comprimido o cifrado: sin comprimir, el servidor lo lee directo (y sabe el largo)
    androidResources {
        noCompress += ['dat', 'aud', 'pnz', 'not', 'bin', 'js', 'html', 'json', 'cfg', 'png', 'md', 'sp2', 'txt']
    }
    signingConfigs {
        release {
            storeFile = file('../firma/piu.jks')
            storePassword = System.getenv('PIU_KS')
            keyAlias = 'piu'
            keyPassword = System.getenv('PIU_KS')
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview-${abi}:157.0.20261005135250"
}
